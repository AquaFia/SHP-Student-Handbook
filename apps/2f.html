<script>

const rooms=[{"name":"Chorus","x":8.9,"y":8.4,"w":15.7,"h":10.6,"status":"open","desc":"Choir rehearsal and vocal performance room.","roomId":"chorus"},{"name":"Music Room / Band","x":26.3,"y":8.4,"w":16.6,"h":10.6,"status":"open","desc":"Band practice, instruments, and music instruction.","roomId":"music-room-band"},{"name":"Occult Clubroom","x":8.9,"y":19.0,"w":9.5,"h":10.0,"status":"open","desc":"Meeting room for the Occult Club.","roomId":"occult-clubroom"},{"name":"Life Skills","x":18.4,"y":19.0,"w":10.3,"h":10.0,"status":"open","desc":"Practical life-skills classroom.","roomId":"life-skills"},{"name":"Talent Committee","x":28.7,"y":19.0,"w":14.2,"h":10.0,"status":"open","desc":"Large meeting room used by the Talent Committee.","roomId":"talent-committee"},{"name":"Costume Closet — North","x":45.0,"y":5.7,"w":14.5,"h":6.0,"status":"restricted","desc":"Upper costume storage room for theater productions.","roomId":"costume-closet-north"},{"name":"Costume Closet — South","x":45.0,"y":11.7,"w":14.5,"h":5.7,"status":"restricted","desc":"Lower costume storage room for theater productions.","roomId":"costume-closet-south"},{"name":"Drama Clubroom","x":45.0,"y":17.4,"w":16.2,"h":11.7,"status":"open","desc":"Drama Club meeting, rehearsal, and preparation room.","roomId":"drama-clubroom"},{"name":"Theater","x":61.2,"y":5.6,"w":23.5,"h":23.5,"status":"open","desc":"Large theater with stage and audience seating.","roomId":"theater"},{"name":"Classroom B-4","x":9.8,"y":40.2,"w":12.3,"h":12.4,"status":"open","desc":"Second-floor B-wing classroom.","roomId":"classroom-b-4"},{"name":"Classroom B-2","x":22.1,"y":40.2,"w":13.5,"h":12.4,"status":"open","desc":"Second-floor B-wing classroom.","roomId":"classroom-b-2"},{"name":"Student Council","x":37.8,"y":39.9,"w":19.0,"h":15.0,"status":"open","desc":"Student Council meeting and administrative room.","roomId":"student-council"},{"name":"Classroom B-1","x":59.0,"y":39.8,"w":12.2,"h":12.8,"status":"open","desc":"Second-floor B-wing const spots=document.getElementById('spots');
let selected=null;
const FloorContract=window.SHPMapFloorContract;
function selectRoom(room,notify=true){
  selected=room.roomId||room.name;
  document.querySelectorAll('.hotspot').forEach(el=>el.classList.toggle('selected',(el.dataset.roomId||el.dataset.name)===selected));
  if(notify) FloorContract.selected(FLOOR_ID,room);
}
function renderSpots(){
  spots.innerHTML='';
  rooms.forEach(room=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='hotspot';
    b.dataset.name=room.name;
    b.dataset.roomId=room.roomId;
    b.setAttribute('aria-label',room.name);
    Object.assign(b.style,{left:room.x+'%',top:room.y+'%',width:room.w+'%',height:room.h+'%'});
    b.addEventListener('click',()=>selectRoom(room));
    spots.appendChild(b);
  });
}
window.addEventListener('message',event=>{
  const msg=event.data;
  if(!msg||typeof msg!=='object')return;
  if(FloorContract.isCommand(msg,FloorContract.TO_FLOOR.SELECT,FLOOR_ID)){
    const room=rooms.find(r=>(msg.roomId&&r.roomId===msg.roomId)||r.name===msg.roomName);
    if(room)selectRoom(room,false);
    return;
  }
  if(FloorContract.isCommand(msg,FloorContract.TO_FLOOR.CLEAR_SELECTION,FLOOR_ID)){
    selected=null;
    document.querySelectorAll('.hotspot').forEach(el=>el.classList.remove('selected'));
  }
});
renderSpots();
FloorContract.ready(FLOOR_ID,{
  rooms,
  description:'Floor 2 — performance, clubs, student government, and B-wing classrooms.',
  status:'Open',
  meta:{label:'2F'}
});
</script>
