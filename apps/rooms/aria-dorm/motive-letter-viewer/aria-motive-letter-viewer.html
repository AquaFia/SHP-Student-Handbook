<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aria Motive Letter Viewer</title>
<style>
:root{color-scheme:dark;--gold:#ffcf40;--ink:#f5ead2;--muted:#a99d88}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090d}body{color:var(--ink);font-family:Inter,Arial,sans-serif;overflow-x:hidden}button{font:inherit}.shell{min-height:100vh;padding:clamp(18px,3vw,42px);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;background:radial-gradient(circle at 50% 43%,rgba(133,88,17,.2),transparent 37%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),#08090d;background-size:auto,42px 42px,42px 42px,auto}.shell:before{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 150px #000}.header{width:min(1180px,100%);margin:0 auto;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid rgba(255,207,64,.24);padding-bottom:14px}.eyebrow{margin:0 0 5px;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}h1{margin:0;font-family:Georgia,serif;font-size:clamp(28px,4vw,48px);font-weight:500}.status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.15em}.status b{color:var(--gold)}.status i{width:34px;height:1px;background:#ffffff47}.stage{position:relative;display:grid;place-items:center;min-height:0;padding:clamp(14px,2.5vh,26px) 48px;perspective:2200px}.shadow{position:absolute;width:min(65vw,600px);height:48px;bottom:5%;border-radius:50%;background:#000b;filter:blur(24px)}.stack,.page{position:absolute;width:min(60vh,65vw,610px);aspect-ratio:10/13}.stack{border-radius:7px;background:#b69b62;border:1px solid #ffd66859;box-shadow:0 12px 30px #0007}.s2{transform:translate(8px,7px) rotate(1deg);opacity:.72}.s3{transform:translate(14px,13px) rotate(1.6deg);opacity:.42}.page{position:relative;z-index:2;margin:0;filter:drop-shadow(0 18px 24px #0008)}.page img{width:100%;height:100%;display:block;object-fit:contain;user-select:none}.outgoing{position:absolute;inset:0;z-index:4;pointer-events:none;will-change:transform,filter}.outgoing.next{animation:shuffleNext .72s cubic-bezier(.45,.02,.2,1) both}.outgoing.prev{animation:shufflePrev .72s cubic-bezier(.45,.02,.2,1) both}@keyframes shuffleNext{0%{z-index:4;transform:translate(0) rotate(0) scale(1);filter:brightness(1) drop-shadow(0 18px 24px #0008)}44%{z-index:4;transform:translate(22%,-5%) rotate(3deg) scale(1.015);filter:brightness(.95) drop-shadow(-18px 25px 24px #000a)}45%{z-index:0}72%{z-index:0;transform:translate(7%,1.8%) rotate(1.2deg) scale(.995);filter:brightness(.7)}100%{z-index:0;transform:translate(12px,10px) rotate(1.4deg) scale(.99);filter:brightness(.62);opacity:.18}}@keyframes shufflePrev{0%{z-index:4;transform:translate(0) rotate(0) scale(1);filter:brightness(1) drop-shadow(0 18px 24px #0008)}44%{z-index:4;transform:translate(-22%,-5%) rotate(-3deg) scale(1.015);filter:brightness(.95) drop-shadow(18px 25px 24px #000a)}45%{z-index:0}72%{z-index:0;transform:translate(-7%,1.8%) rotate(-1.2deg) scale(.995);filter:brightness(.7)}100%{z-index:0;transform:translate(12px,10px) rotate(1.4deg) scale(.99);filter:brightness(.62);opacity:.18}}.edge{position:absolute;z-index:6;top:3%;bottom:3%;width:18%;border:0;background:transparent;cursor:pointer}.left{left:3%;cursor:w-resize}.right{right:3%;cursor:e-resize}.edge:disabled{cursor:default}.cue{position:absolute;z-index:5;right:7%;bottom:6%;width:30px;height:30px;border-right:2px solid #ffd545b8;border-bottom:2px solid #ffd545b8;opacity:.55;animation:cue 2s ease-in-out infinite}@keyframes cue{50%{opacity:.95;transform:translate(3px,3px)}}.controls{width:min(690px,100%);margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}.controls>button{border:1px solid #ffcf4052;border-radius:999px;padding:11px 18px;color:var(--ink);background:#141418cc;cursor:pointer;transition:.2s}.controls>button:last-child{justify-self:end}.controls>button:hover:not(:disabled),.controls>button:focus-visible{border-color:var(--gold);background:#ffcf401c;transform:translateY(-1px);outline:none}.controls>button:disabled{opacity:.28;cursor:not-allowed}.dots{display:flex;gap:10px;align-items:center}.dots button{width:9px;height:9px;padding:0;border:1px solid #82745b;border-radius:50%;background:transparent;cursor:pointer;transition:.2s}.dots button.active{width:26px;border-radius:10px;border-color:var(--gold);background:var(--gold);box-shadow:0 0 12px #ffcf408c}.hint{margin:11px auto 0;color:#776f62;font-size:11px;text-align:center}@media(max-width:650px){.shell{padding:16px 12px 18px}.stage{padding-inline:0}.page,.stack{width:min(72vh,92vw)}.controls{gap:10px}.controls>button{padding:10px 13px;font-size:13px}.hint{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main class="shell"><header class="header"><div><p class="eyebrow">Recovered Evidence · Aria Matsuda</p><h1>Motive Letter</h1></div><div class="status"><b id="current">01</b><i></i><span>03</span></div></header><section class="stage" id="stage" aria-label="Motive letter, page 1 of 3"><div class="shadow"></div><div class="stack s3"></div><div class="stack s2"></div><figure class="page" id="page"><img id="image" alt="Aria’s motive letter, page 1" draggable="false"><img id="outgoing" class="outgoing" alt="" aria-hidden="true" draggable="false" hidden><button class="edge left" id="edgePrev" aria-label="Previous page"></button><button class="edge right" id="edgeNext" aria-label="Next page"></button><span class="cue"></span></figure></section><nav class="controls" aria-label="Page navigation"><button id="prev">← Previous</button><div class="dots" id="dots"></div><button id="next">Next →</button></nav><p class="hint">Click the page edges, swipe, or use the arrow keys.</p></main>
<script>
const pages=["letter-pages/aria-motive-letter-page-1.png","letter-pages/aria-motive-letter-page-2.png","letter-pages/aria-motive-letter-page-3.png"];let index=0,startX=null,locked=false;const image=document.getElementById('image'),outgoing=document.getElementById('outgoing'),status=document.getElementById('current'),stage=document.getElementById('stage'),prev=document.getElementById('prev'),next=document.getElementById('next'),edgePrev=document.getElementById('edgePrev'),edgeNext=document.getElementById('edgeNext'),dots=document.getElementById('dots');
pages.forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Go to page '+(i+1));b.onclick=()=>go(i);dots.appendChild(b)});
function render(){image.src=pages[index];image.alt='Aria’s motive letter, page '+(index+1);status.textContent=String(index+1).padStart(2,'0');stage.setAttribute('aria-label','Motive letter, page '+(index+1)+' of '+pages.length);prev.disabled=edgePrev.disabled=next.disabled=edgeNext.disabled=locked;[...dots.children].forEach((d,i)=>{d.classList.toggle('active',i===index);d.disabled=locked;if(i===index)d.setAttribute('aria-current','page');else d.removeAttribute('aria-current')})}
function go(target){target=(target+pages.length)%pages.length;if(target===index||locked)return;const old=index,dir=target===(index+1)%pages.length?'next':'prev';locked=true;outgoing.src=pages[old];outgoing.hidden=false;outgoing.className='outgoing';void outgoing.offsetWidth;outgoing.classList.add(dir);index=target;render();setTimeout(()=>{outgoing.hidden=true;outgoing.className='outgoing';locked=false;render()},720)}
prev.onclick=edgePrev.onclick=()=>go(index-1);next.onclick=edgeNext.onclick=()=>go(index+1);addEventListener('keydown',e=>{if(e.key==='Escape'){parent.postMessage({type:'SHP_CLOSE_MOTIVE_LETTER_VIEWER'},'*');return}if(e.key==='ArrowRight'||e.key==='PageDown')go(index+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(index-1);if(e.key==='Home')go(0);if(e.key==='End')go(pages.length-1)});stage.addEventListener('touchstart',e=>startX=e.touches[0]?.clientX??null,{passive:true});stage.addEventListener('touchend',e=>{if(startX===null)return;const d=(e.changedTouches[0]?.clientX??startX)-startX;if(Math.abs(d)>45)go(index+(d<0?1:-1));startX=null},{passive:true});render();
</script></body></html>
