<script>
const FLOOR_ID='3F';
const rooms=[{"name":"Classroom C-10","x":9.3,"y":13.4,"w":10,"h":11.2,"status":"open","desc":"Third-floor C-wing classroom.","roomId":"classroom-c-10"},{"name":"Classroom C-9","x":19.3,"y":13.4,"w":10.4,"h":11.2,"status":"open","desc":"Third-floor C-wing classroom.","roomId":"classroom-c-9"},{"name":"Classroom C-8","x":9.3,"y":24.6,"w":10,"h":10.6,"status":"open","desc":"Third-floor C-wing classroom.","roomId":"classroom-c-8"},{"name":"Classroom C-7","x":19.3,"y":24.6,"w":10.4,"h":10.6,"status":"open","desc":"Third-floor C-wing classroom.","roomId":"classroom-c-7"},{"name":"Classroom C-6","x":9.3,"y":35.2,"w":10,"h":10.7,"status":"open","desc":"Third-floor C-wing classroom.","roomId":"classroom-c-6"},{"name":"Classroom C-5","x":19.3,"y":35.2,"w":10.4,"h":10.7,"status":"open","desc":"Third-floor C-wing classroom.","roomId":"classroom-c-5"},{"name":"Classroom C-4","x":9.3,"y":45.9,"w":10,"h":10.8,"status":"open","desc":"Third-floor C-wing classroom.","roomId":"classroom-c-4"},{"name":"Classroom C-3","x":19.3,"y":45.9,"w":10.4,"h":10.8,"status":"open","desc":"Third-floor C-wing classroom.","roomId":"classroom-c-3"},{"name":"Classroom C-2","x":9.3,"y":56.7,"w":10,"h":10.5,"status":"open","desc":"Third-floor C-wing classroom.","roomId":"classroom-c-2"},{"name":"Classroom C-1","x":19.3,"y":56.7,"w":10.4,"h":10.5,"status":"open","desc":"Third-floor C-wing classroom.","roomId":"classroom-c-1"},{"name":"Computer Lab","x":36,"y":13.4,"w":13.5,"h":16.7,"status":"open","desc":"Computer science instruction and workstation lab.","roomId":"computer-lab"},{"name":"Robotics Lab","x":49.5,"y":13.4,"w":13.5,"h":16.7,"status":"open","desc":"Robotics construction, programming, and instruction lab.","roomId":"robotics-lab"},{"name":"Architectural and Mechanical Design Course Room","x":36,"y":30.1,"w":13.5,"h":12.5,"status":"open","desc":"Architectural drafting and mechanical design classroom.","roomId":"architectural-and-mechanical-design-course-room"},{"name":"Testing / Experiment Room","x":49.5,"y":30.1,"w":13.5,"h":12.5,"status":"restricted","desc":"Controlled room for testing prototypes and experiments.","roomId":"testing-experiment-room"},{"name":"Project Workrooms — West","x":36,"y":42.6,"w":13.5,"h":24.6,"status":"open","desc":"A bank of smaller project and workshop rooms.","roomId":"project-workrooms-west"},{"name":"Project Workrooms — East","x":50.8,"y":42.6,"w":12.2,"h":24.6,"status":"open","desc":"A bank of smaller project and workshop rooms.","roomId":"project-workrooms-east"},{"name":"Science / Chemistry Lab","x":69,"y":5.6,"w":15.8,"h":17.4,"status":"open","desc":"Large general science and chemistry laboratory.","roomId":"science-chemistry-lab"},{"name":"Chemicals Closet","x":84.8,"y":13.5,"w":6.4,"h":9.5,"status":"restricted","desc":"Secured chemical storage connected to the science lab.","roomId":"chemicals-closet"},{"name":"Printer Room","x":91.2,"y":13.5,"w":5.6,"h":9.5,"status":"restricted","desc":"Printing and document-production room.","roomId":"printer-room"},{"name":"Staff Rooms","x":69,"y":28,"w":23.4,"h":25.6,"status":"restricted","desc":"Faculty offices and shared staff workrooms.","roomId":"staff-rooms"},{"name":"Principal’s Office","x":80.9,"y":53.5,"w":11.5,"h":13.7,"status":"restricted","desc":"The principal’s private administrative office.","roomId":"principals-office"},{"name":"Planetarium","x":36.5,"y":75.5,"w":27.5,"h":21.7,"status":"open","desc":"Planetarium and astronomy presentation space.","roomId":"planetarium"}];
const spots=document.getElementById('spots');
let selected=null;
const FloorContract=window.SHPMapFloorContract;
function selectRoom(room,notify=true){
  selected=room.roomId||room.name;
  document.querySelectorAll('.hotspot').forEach(el=>el.classList.toggle('selected',(el.dataset.roomId||el.dataset.name)===selected));
  if(notify) FloorContract.selected(FLOOR_ID,room);
}
function renderSpots(){
  spots.innerHTML='';
  rooms.forEach(room=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='hotspot';
    b.dataset.name=room.name;
    b.dataset.roomId=room.roomId;
    b.setAttribute('aria-label',room.name);
    Object.assign(b.style,{left:room.x+'%',top:room.y+'%',width:room.w+'%',height:room.h+'%'});
    b.addEventListener('click',()=>selectRoom(room));
    spots.appendChild(b);
  });
}
window.addEventListener('message',event=>{
  const msg=event.data;
  if(!msg||typeof msg!=='object')return;
  if(FloorContract.isCommand(msg,FloorContract.TO_FLOOR.SELECT,FLOOR_ID)){
    const room=rooms.find(r=>(msg.roomId&&r.roomId===msg.roomId)||r.name===msg.roomName);
    if(room)selectRoom(room,false);
    return;
  }
  if(FloorContract.isCommand(msg,FloorContract.TO_FLOOR.CLEAR_SELECTION,FLOOR_ID)){
    selected=null;
    document.querySelectorAll('.hotspot').forEach(el=>el.classList.remove('selected'));
  }
});
renderSpots();
FloorContract.ready(FLOOR_ID,{
  rooms,
  description:'Floor 3 — advanced labs, C-wing classrooms, administration, and the planetarium.',
  status:'Open',
  meta:{label:'3F'}
});
</script>
