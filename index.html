<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safe Havens Peak Student Handbook</title>
<style>
:root{--bg:#05070b;--green:#55f5a3;--gold:#e6c36a;--open:3900ms}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#eefcf5}
#appHost{position:fixed;inset:0;background:#05070b;opacity:0;visibility:hidden;transition:opacity .28s ease}
#appHost.visible{opacity:1;visibility:visible}
#appFrame{width:100%;height:100%;border:0;background:#05070b}

:root{--gold:#d7b56d;--gold2:#f4d78f;--green2:#78d8a2}
*{box-sizing:border-box}
#appHost{width:100%;height:100%;overflow:hidden;background:#05090a;color:#eef2eb;font-family:Arial,Helvetica,sans-serif}
.shell{height:100%;display:grid;grid-template-columns:210px 1fr;background:radial-gradient(circle at 82% 10%,rgba(47,143,99,.16),transparent 28%),linear-gradient(135deg,#101719,#05090a 65%)}
.sidebar{padding:26px 20px;border-right:1px solid rgba(215,181,109,.23);background:linear-gradient(180deg,#0c1714,#05090a);display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;color:var(--gold2);font-size:13px;font-weight:800;letter-spacing:.08em}
.seal{width:42px;height:42px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;background:#11261b;font-size:24px}
.nav{margin-top:24px}.nav button{width:100%;padding:12px;border:1px solid transparent;border-radius:10px;background:transparent;color:#d9dfd9;text-align:left;cursor:pointer}.nav button.active{border-color:rgba(215,181,109,.35);background:rgba(52,126,84,.13)}
.status{margin-top:auto;color:var(--green2);font-size:10px;letter-spacing:.14em}
.home{padding:30px;overflow:auto}
.home h1{margin:0;color:#f5f0dd;font-size:38px}.home>p{color:rgba(230,235,226,.56)}
.grid{margin-top:24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(180px,1fr));gap:16px}
.app{border:1px solid rgba(215,181,109,.25);border-radius:16px;background:linear-gradient(145deg,#1b2726,#060a0b);color:#eff2eb;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.app:hover{border-color:rgba(244,215,143,.7);transform:translateY(-2px)}
.icon{width:54px;height:54px;border:1px solid rgba(215,181,109,.55);border-radius:15px;display:grid;place-items:center;font-size:24px;color:var(--gold2);background:rgba(40,115,72,.22)}
.app strong{font-size:14px}.app small{display:block;margin-top:8px;color:rgba(226,232,223,.5);line-height:1.4}
.viewer{position:fixed;inset:0;background:#05090a;display:none;z-index:5}.viewer.open{display:block}
.viewer iframe{width:100%;height:100%;border:0;background:#05090a}

.roam-return{position:fixed;right:22px;bottom:22px;z-index:6;display:none;padding:13px 17px;border:1px solid rgba(215,181,109,.55);border-radius:11px;background:linear-gradient(145deg,#1b2726,#08100e);color:#f4d78f;font-weight:900;letter-spacing:.04em;cursor:pointer;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.roam-return.visible{display:block}
.roam-return:hover,.roam-return:focus-visible{border-color:#f4d78f;transform:translateY(-1px);outline:none}

@media(max-width:850px){.shell{grid-template-columns:150px 1fr}.home{padding:20px}.grid{gap:10px}.app{padding:12px}}


:root{
  --hb-open-ms:3900ms;
  --hb-close-ms:3000ms;
  --hb-startup-ms:1700ms;
  --hb-room-return-ms:5600ms;
}
#transition{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  place-items:center;
  overflow:hidden;
  background:#05070b;
  pointer-events:none;
  perspective:1900px;
  isolation:isolate;
}
#transition.startup,
#transition.opening,
#transition.room-enter,
#transition.room-exit{
  display:grid;
  pointer-events:all;
}
#transition.opening{animation:hbBackdropOpen var(--hb-open-ms) ease both}
#transition.room-enter{animation:hbBackdropClose var(--hb-close-ms) ease both}
#transition.room-exit{
  background:transparent;
  animation:hbRoomReturnBackdrop var(--hb-room-return-ms) ease both;
}
#transition.ready{display:none}
#transition::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 48%,rgba(35,73,104,.24),rgba(2,5,9,.95) 72%);
  opacity:0;
  z-index:-1;
}
#transition.startup::before{opacity:1}
#transition.opening::before{animation:hbAtmosphereOpen var(--hb-open-ms) ease both}
#transition.room-enter::before{animation:hbAtmosphereClose var(--hb-close-ms) ease both}
#transition.room-exit::before{animation:hbRoomReturnAtmosphere var(--hb-room-return-ms) ease both}

#device{
  position:absolute;
  left:50%;
  top:50%;
  width:min(31vw,430px);
  height:auto;
  transform-origin:50% 50%;
  will-change:transform,filter,opacity;
  filter:
    drop-shadow(0 28px 34px rgba(0,0,0,.78))
    drop-shadow(0 0 18px rgba(65,255,157,.16));
}
#transition.startup #device{
  animation:hbStartup var(--hb-startup-ms) cubic-bezier(.18,.72,.18,1) both;
}
#transition.opening #device{
  animation:hbOpen var(--hb-open-ms) cubic-bezier(.18,.70,.15,1) both;
}
#transition.room-enter #device{
  animation:hbClose var(--hb-close-ms) cubic-bezier(.35,.02,.52,.98) both;
}
#transition.room-exit #device{
  animation:hbRoomReturn var(--hb-room-return-ms) cubic-bezier(.18,.70,.15,1) both;
}


#screenFill{
  position:absolute;
  left:50%;
  top:50%;
  width:min(31vw,430px);
  aspect-ratio:455 / 805;
  transform-origin:50% 50%;
  will-change:transform,filter,opacity;
  z-index:0;
  pointer-events:none;
}
#screenFill::before{
  content:"";
  position:absolute;
  left:13.5%;
  right:13.5%;
  top:11.2%;
  bottom:14.2%;
  border-radius:3%;
  background:
    radial-gradient(circle at 50% 22%,rgba(33,82,70,.34),transparent 38%),
    linear-gradient(180deg,#07110f 0%,#050b0d 48%,#080d12 100%);
  box-shadow:
    inset 0 0 34px rgba(0,0,0,.9),
    inset 0 0 3px rgba(105,255,175,.22);
}
#device{z-index:1}
#transition.startup #screenFill{animation:hbStartup var(--hb-startup-ms) cubic-bezier(.18,.72,.18,1) both}
#transition.opening #screenFill{animation:hbOpen var(--hb-open-ms) cubic-bezier(.18,.70,.15,1) both}
#transition.room-enter #screenFill{animation:hbClose var(--hb-close-ms) cubic-bezier(.35,.02,.52,.98) both}
#transition.room-exit #screenFill{animation:hbRoomReturn var(--hb-room-return-ms) cubic-bezier(.18,.70,.15,1) both}
@media(max-width:700px){#screenFill{width:min(54vw,330px)}}

#screenGlow{
  position:absolute;
  left:50%;
  top:50%;
  width:30vw;
  height:18vw;
  min-width:360px;
  min-height:205px;
  transform:translate(-50%,-50%);
  border-radius:6px;
  background:radial-gradient(circle,rgba(116,228,255,.22),rgba(7,17,31,.04) 62%,transparent 74%);
  opacity:0;
  filter:blur(12px);
}
#transition.opening #screenGlow{animation:hbGlowOpen var(--hb-open-ms) ease both}
#transition.room-enter #screenGlow{animation:hbGlowClose var(--hb-close-ms) ease both}
#transition.room-exit #screenGlow{animation:hbRoomReturnGlow var(--hb-room-return-ms) ease both}

#prompt{
  position:absolute;
  left:50%;
  bottom:7vh;
  transform:translateX(-50%);
  display:none;
  text-align:center;
  color:#dffdf0;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
  text-shadow:0 0 16px rgba(67,255,158,.35);
  animation:hbPromptPulse 1.8s ease-in-out infinite;
  cursor:pointer;
  user-select:none;
}
#prompt small{
  display:block;
  margin-top:8px;
  color:#91a7b7;
  font-size:11px;
  letter-spacing:.12em;
}
#transition.startup #prompt{
  display:block;
  animation-delay:1.45s;
}

@keyframes hbStartup{
  0%{transform:translate(calc(-50% + 54vw),calc(-50% + 72vh)) rotate(7deg) scale(.42);opacity:0;filter:drop-shadow(0 10px 18px rgba(0,0,0,.42)) blur(.45px)}
  18%{opacity:1}
  72%{transform:translate(-50%,-48%) rotate(-2deg) scale(.84);opacity:1}
  100%{transform:translate(-50%,-50%) rotate(0deg) scale(.82);opacity:1}
}
@keyframes hbOpen{
  0%{transform:translate(-50%,-50%) rotate(0deg) scale(.82);opacity:1}
  16%{transform:translate(-50%,-53%) rotate(-4deg) scale(.88)}
  39%{transform:translate(-50%,-50%) rotate(-90deg) scale(.93)}
  52%{transform:translate(-50%,-50%) rotate(-90deg) scale(1.02)}
  61%{transform:translate(-50%,-50%) rotate(-90deg) scale(1.02)}
  100%{transform:translate(-50%,-50%) rotate(-90deg) scale(7.15);opacity:0;filter:drop-shadow(0 0 0 transparent) blur(0)}
}
@keyframes hbClose{
  0%{transform:translate(-50%,-50%) rotate(-90deg) scale(7.15);opacity:0}
  18%{opacity:1}
  42%{transform:translate(-50%,-50%) rotate(-90deg) scale(1.02);opacity:1}
  55%{transform:translate(-50%,-50%) rotate(-90deg) scale(1.02)}
  72%{transform:translate(-50%,-50%) rotate(0deg) scale(.84)}
  100%{transform:translate(calc(-50% + 54vw),calc(-50% + 72vh)) rotate(7deg) scale(.42);opacity:0}
}
@keyframes hbRoomReturn{
  0%{transform:translate(calc(-50% + 54vw),calc(-50% + 72vh)) rotate(7deg) scale(.42);opacity:0;filter:drop-shadow(0 10px 18px rgba(0,0,0,.42)) blur(.45px)}
  7%{opacity:1}
  27%{transform:translate(-50%,-48%) rotate(-2deg) scale(.84);opacity:1}
  33%{transform:translate(-50%,-50%) rotate(0deg) scale(.82);opacity:1}
  45%{transform:translate(-50%,-53%) rotate(-4deg) scale(.88)}
  62%{transform:translate(-50%,-50%) rotate(-90deg) scale(.93)}
  72%{transform:translate(-50%,-50%) rotate(-90deg) scale(1.02)}
  79%{transform:translate(-50%,-50%) rotate(-90deg) scale(1.02)}
  100%{transform:translate(-50%,-50%) rotate(-90deg) scale(7.15);opacity:0;filter:drop-shadow(0 0 0 transparent) blur(0)}
}
@keyframes hbBackdropOpen{0%,82%{background:#05070b}100%{background:rgba(5,7,11,0)}}
@keyframes hbRoomReturnBackdrop{0%,35%{background:rgba(5,7,11,0)}60%,97%{background:#05070b}100%{background:rgba(5,7,11,0)}}
@keyframes hbBackdropClose{0%{background:rgba(5,7,11,0)}18%,74%{background:#05070b}100%{background:rgba(5,7,11,0)}}
@keyframes hbAtmosphereOpen{0%{opacity:1}65%{opacity:1}100%{opacity:0}}
@keyframes hbRoomReturnAtmosphere{0%,35%{opacity:0}60%,97%{opacity:1}100%{opacity:0}}
@keyframes hbAtmosphereClose{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@keyframes hbGlowOpen{0%,42%{opacity:0}58%{opacity:.55}78%{opacity:1}100%{opacity:0}}
@keyframes hbRoomReturnGlow{0%,57%{opacity:0}69%{opacity:.55}85%{opacity:1}100%{opacity:0}}
@keyframes hbGlowClose{0%{opacity:0}19%{opacity:1}43%{opacity:.58}70%,100%{opacity:0}}
@keyframes hbPromptPulse{
  0%,100%{opacity:.55;transform:translateX(-50%) translateY(0)}
  50%{opacity:1;transform:translateX(-50%) translateY(-3px)}
}
@media(max-width:700px){
  #device{width:min(54vw,330px)}
  #screenGlow{min-width:260px;min-height:150px}
  #prompt{bottom:5vh;font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  :root{
    --hb-open-ms:420ms;
    --hb-close-ms:420ms;
    --hb-startup-ms:420ms;
    --hb-room-return-ms:520ms;
  }
  #prompt{animation:none}
}

/* Accessibility/UI scale adjustment */
body{font-size:17px;}
.app strong{font-size:17px!important;}
.app small{font-size:13px!important;line-height:1.5!important;}
.home>p{font-size:17px!important;}
.brand{font-size:15px!important;}
.nav button{font-size:16px!important;}
.app-header h1{font-size:34px!important;}
.app-header p{font-size:15px!important;}
.handbook-back{
  font-size:14px!important;
  padding:12px 18px!important;
}
.profile-name{font-size:34px!important;}
.profile-bio,
.profile-section p,
.rule-card p,
.phase-card p,
.procedure-card p,
.protocol-card p,
.grade-table td,
.faculty-box p,
.mentor-box p,
.placeholder p{
  font-size:14px!important;
  line-height:1.7!important;
}
.profile-stat strong{font-size:12px!important;}
.profile-stat small{font-size:10px!important;}
.report-tab,.reg-tab{font-size:13px!important;padding:11px 15px!important;}
.report-section-title,.reg-section-title{font-size:25px!important;}
.grade-table th{font-size:11px!important;}

</style>

  <div id="prompt">Press Anywhere<small>Open Student Handbook</small></div>
</div>
<script>
const handbookApps=[
  ['Student Profiles','👤','apps/student-profiles.html','Student identity records and personal notes.'],
  ['School Map','⌖','apps/map.html?mode=handbook','Campus floors, classrooms, dormitories, and restricted areas.'],
  ['Messages','✉','apps/messages.html','School announcements and private messages.'],
  ['Notes','▤','apps/notes.html','Personal notes, clues, and investigation records.'],
  ['Grades & Attendance','A+','apps/grades-attendance.html','Academic progress, attendance, and promotion standing.'],
  ['Assignments','✓','apps/assignments.html','Current, upcoming, and completed assignments.'],
  ['ERiSU.EXE','◆','apps/erisu.html','Encrypted academy support and analysis program.'],
  ['School Regulations','⚖','apps/school-regulations.html','Academy rules, class trials, and incident protocols.']
];

const host=document.getElementById('appHost');
const transition=document.getElementById('transition');
const grid=document.getElementById('grid');
const viewer=document.getElementById('viewer');
const frame=document.getElementById('appFrame');
const returnToRoam=document.getElementById('returnToRoam');
let busy=false;
let roamingSession=false;

grid.innerHTML=handbookApps.map((app,index)=>`
  <button class="app" data-index="${index}">
    <span class="icon">${app[1]}</span>
    <span><strong>${app[0]}</strong><small>${app[3]}</small></span>
  </button>
`).join('');

grid.querySelectorAll('.app').forEach(button=>{
  button.addEventListener('click',()=>{
    const appIndex=Number(button.dataset.index);
    const app=handbookApps[appIndex];
    roamingSession=false;
    returnToRoam.classList.remove('visible');
    frame.src=app[2];
    frame.title=app[0];
    viewer.classList.add('open');

  });
});


function openHandbook(){
  if(busy)return;
  busy=true;
  transition.className='opening';
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>host.classList.add('visible'),reduced?360:3820);
  setTimeout(()=>{
    transition.className='ready';
    busy=false;
  },reduced?490:3970);
}

function normalizeRoomEntryContext(value={}){
  const ctx=value && typeof value==='object' ? value : {};
  return {
    source: ctx.source || 'map',
    returnTarget: ctx.returnTarget || (ctx.source==='explorer' ? 'hallway' : 'map'),
    floor: ctx.floor || null,
    locationId: ctx.locationId || null,
    spawnId: ctx.spawnId || null
  };
}
function roomEntryUrl(roomId,context={}){
  const ctx=normalizeRoomEntryContext(context);
  const q=new URLSearchParams();
  q.set('shpSource',ctx.source||'map');q.set('shpReturn',ctx.returnTarget||'map');
  if(ctx.floor)q.set('shpFloor',ctx.floor);if(ctx.locationId)q.set('shpLocation',ctx.locationId);if(ctx.spawnId)q.set('shpSpawn',ctx.spawnId);
  return `apps/rooms/${encodeURIComponent(roomId)}/index.html?${q.toString()}`;
}
function enterRoom(roomId,context={source:'map'}){
  if(busy || !roomId)return;
  const ctx=normalizeRoomEntryContext(context);
  busy=true;transition.className='room-enter';
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{frame.src=roomEntryUrl(roomId,ctx);frame.title=roomId;viewer.classList.add('open');},reduced?120:520);
  setTimeout(()=>{transition.className='ready';busy=false;},reduced?490:3070);
}

function enterDormExplorer(options={}){
  roamingSession=true;returnToRoam.classList.remove('visible');
  const q=new URLSearchParams({mode:'handbook'});if(options.spawnId)q.set('shpSpawn',options.spawnId);if(options.source)q.set('shpSource',options.source);
  frame.src=`apps/explorer/dorm/index.html?${q.toString()}`;frame.title='3D Dorm Hallway';viewer.classList.add('open');
}

function showHandbookOverRoaming(){
  if(!roamingSession)return;
  viewer.classList.remove('open');
  returnToRoam.classList.add('visible');
}

returnToRoam.addEventListener('click',()=>{
  if(!roamingSession)return;
  returnToRoam.classList.remove('visible');
  viewer.classList.add('open');
  frame.contentWindow?.postMessage({type:'shp:resume-roaming'},'*');
});

window.addEventListener('message',event=>{
  const msg=event.data;
  if(!msg || typeof msg!=='object')return;
  if(event.source!==frame.contentWindow)return;

  if(msg.type==='SHP_OPEN_HANDBOOK'){
    if(msg.preserveRoaming && roamingSession){
      showHandbookOverRoaming();
    }else{
      roamingSession=false;
      returnToRoam.classList.remove('visible');
      viewer.classList.remove('open');
      frame.src='about:blank';
    }
    return;
  }

  // M.S.7 and earlier compatibility alias.
  if(msg.type==='shp:return-handbook'){
    roamingSession=false;
    returnToRoam.classList.remove('visible');
    viewer.classList.remove('open');
    frame.src='about:blank';
    return;
  }

  if(msg.type==='shp:enter-dorm-explorer'){
    enterDormExplorer();
    return;
  }
  if(msg.type==='SHP_OPEN_LOCATION' && msg.locationId==='dorm-hall'){enterDormExplorer({spawnId:msg.spawnId||'stairs',source:msg.source||'room'});return;}

  if(msg.type==='shp:open-handbook-from-roaming'){
    showHandbookOverRoaming();
    return;
  }

  if(msg.type==='SHP_RETURN_PREVIOUS' || msg.type==='shp:room-return'){
    const ctx=normalizeRoomEntryContext(msg.context||{});
    if(ctx.returnTarget==='hallway'){
      enterDormExplorer({spawnId:ctx.spawnId||null,source:'room'});
    }else{
      roamingSession=false;returnToRoam.classList.remove('visible');
      const targetFloor=ctx.floor||'1F';
      frame.src=`apps/map.html?mode=handbook&floor=${encodeURIComponent(targetFloor)}`;
      frame.title='School Map';viewer.classList.add('open');
    }
    return;
  }

  if(msg.type==='SHP_OPEN_MAP' || msg.type==='shp:exit-roaming-to-map'){
    roamingSession=false;
    returnToRoam.classList.remove('visible');
    const targetFloor=msg.floor || msg.context?.floor || '1F';
    frame.src=`apps/map.html?mode=handbook&floor=${encodeURIComponent(targetFloor)}`;
    frame.title='School Map';
    viewer.classList.add('open');
    return;
  }

  if((msg.type==='SHP_OPEN_ROOM' || msg.type==='shp:open-room') && msg.roomId) enterRoom(msg.roomId,msg.context||{source:msg.source||'map'});
});


transition.addEventListener('click',openHandbook);
transition.addEventListener('keydown',event=>{
  if(event.key==='Enter' || event.key===' '){
    event.preventDefault();
    openHandbook();
  }
});
</script>
